packages:
  - "apps/*"
  - "packages/*"

# pnpm bloque par défaut les scripts d'installation des dépendances, pour qu'un paquet
# compromis ne s'exécute pas à l'installation, et l'installation ÉCHOUE tant qu'un
# paquet concerné n'a pas été tranché explicitement. La liste est versionnée pour qu'une
# installation soit reproductible d'une machine à l'autre et dans les images Docker,
# plutôt que dépendante d'une approbation interactive locale.
#
# Le nom du réglage est `allowBuilds` depuis pnpm 12 ; `onlyBuiltDependencies`, son
# prédécesseur, est silencieusement ignoré.
#
# Autorisés parce que nécessaires : Prisma télécharge ses moteurs, esbuild et swc leurs
# binaires natifs, sharp pose le sien — sans quoi son import échoue à l'exécution sur un
# message qui parle d'un module introuvable, pas d'un script bloqué — et les autres
# compilent des extensions de surveillance de fichiers.
# Refusés jusqu'à constatation du contraire : les dépendances de Testcontainers, et
# `msgpackr-extract` que BullMQ traîne — toutes compilent des optimisations natives dont
# leur bibliothèque sait se passer, en JS pur.
allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  cpu-features: false
  protobufjs: false
  ssh2: false
  msgpackr-extract: false

# pnpm installe par défaut les dépendances de pair, même optionnelles. `@prisma/client`
# déclare ainsi `prisma` (la CLI, 40 Mo) et `typescript` (24 Mo) : sans ce réglage, ils
# entrent dans l'image d'exécution de l'API, qui n'en a aucun usage. Les vraies
# dépendances de pair du dépôt sont déclarées explicitement là où elles sont utilisées.
autoInstallPeers: false
