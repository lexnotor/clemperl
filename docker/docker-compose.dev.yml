# Environnement de développement de ClemPerl.
#
# Chaque application est publiée sur son propre port : pas de proxy, pas de TLS, pas de
# certificat à générer. Les cookies n'étant PAS isolés par port, une session ouverte sur
# localhost:3000 vaut pour localhost:3001 et localhost:3002 — le partage de session se
# vérifie donc ici sans aucune configuration.
#
# nginx reste dans `docker/proxy/`, pour la production, et n'est pas démarré ici. Le seul
# écart assumé : en production le cookie porte un domaine parent, réglage qui n'a pas
# lieu d'être sur localhost.
#
# Le contexte de build est la RACINE du dépôt (`context: ..`) : le workspace pnpm a
# besoin du lockfile unique et de `packages/`, et `turbo prune` part de là.
#
# Les sondes interrogent 127.0.0.1 et non `localhost` : dans ces images, `localhost`
# résout vers ::1 alors que les serveurs écoutent sur 0.0.0.0, qui est IPv4 seulement.
#
# Les sources sont montées dossier par dossier, jamais la racine d'un package : monter
# celle-ci masquerait les `node_modules` installés dans l'image.
name: clemperl_dev

services:
  postgres:
    container_name: clemperl_dev_postgres
    build:
      context: ..
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: clemperl
      POSTGRES_PASSWORD: clemperl
      POSTGRES_DB: clemperl
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clemperl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    container_name: clemperl_dev_redis
    build:
      context: ..
      dockerfile: docker/redis/Dockerfile
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    container_name: clemperl_dev_mailpit
    ports:
      - "8025:8025"
    build:
      context: ..
      dockerfile: docker/mailpit/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  storefront:
    container_name: clemperl_dev_storefront
    ports:
      - "3000:3000"
    build:
      context: ..
      dockerfile: apps/storefront/Dockerfile
      target: dev
    env_file: ../.env
    volumes:
      - ../apps/storefront/src:/app/apps/storefront/src
      - ../packages/core/src:/app/packages/core/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../packages/i18n/src:/app/packages/i18n/src
      - ../packages/i18n/messages:/app/packages/i18n/messages
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  vendor:
    container_name: clemperl_dev_vendor
    ports:
      - "3001:3001"
    build:
      context: ..
      dockerfile: apps/vendor/Dockerfile
      target: dev
    env_file: ../.env
    volumes:
      - ../apps/vendor/src:/app/apps/vendor/src
      - ../packages/core/src:/app/packages/core/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../packages/i18n/messages:/app/packages/i18n/messages
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  admin:
    container_name: clemperl_dev_admin
    ports:
      - "3002:3002"
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      target: dev
    env_file: ../.env
    volumes:
      - ../apps/admin/src:/app/apps/admin/src
      - ../packages/core/src:/app/packages/core/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../packages/i18n/messages:/app/packages/i18n/messages
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  api:
    container_name: clemperl_dev_api
    ports:
      - "3003:3003"
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file: ../.env
    volumes:
      - ../apps/api/src:/app/apps/api/src
      # Les suites E2E de l'API vivent dans `test/`, par convention : seul l'E2E
      # est centralisé, les autres couches sont colocalisées dans `src/`.
      - ../apps/api/test:/app/apps/api/test
      # Les configurations Jest vivent à la racine de l'application, pas dans
      # `src/` : sans ce montage, toute modification exige un rebuild complet.
      - ../apps/api/jest.transform.ts:/app/apps/api/jest.transform.ts
      - ../apps/api/jest.config.ts:/app/apps/api/jest.config.ts
      - ../apps/api/jest.config.integration.ts:/app/apps/api/jest.config.integration.ts
      - ../apps/api/jest.config.contract.ts:/app/apps/api/jest.config.contract.ts
      - ../apps/api/jest.config.e2e.ts:/app/apps/api/jest.config.e2e.ts
      - ../packages/core/src:/app/packages/core/src
      - ../packages/db/src:/app/packages/db/src
      - ../packages/db/prisma:/app/packages/db/prisma
      # Testcontainers démarre de vrais conteneurs : il lui faut le démon Docker.
      # Les conteneurs qu'il crée sont FRÈRES de celui-ci, pas enfants — ils ne sont
      # donc joignables ni par localhost ni par un port publié, mais par leur adresse
      # sur le réseau Docker.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  pg_data:
    name: clemperl_dev_pg_data
  redis_data:
    name: clemperl_dev_redis_data
