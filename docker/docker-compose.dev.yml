# Environnement de développement de ClemPerl.
#
# Chaque application est publiée sur son propre port : pas de proxy, pas de TLS, pas de
# certificat à générer. Les cookies n'étant PAS isolés par port, une session ouverte sur
# localhost:3000 vaut pour localhost:3001 et localhost:3002 — le partage de session se
# vérifie donc ici sans aucune configuration.
#
# nginx reste dans `docker/proxy/`, pour la production, et n'est pas démarré ici. Le seul
# écart assumé : en production le cookie porte un domaine parent, réglage qui n'a pas
# lieu d'être sur localhost.
#
# Le contexte de build est la RACINE du dépôt (`context: ..`) : le workspace pnpm a
# besoin du lockfile unique et de `packages/`, et `turbo prune` part de là.
#
# Les sondes interrogent 127.0.0.1 et non `localhost` : dans ces images, `localhost`
# résout vers ::1 alors que les serveurs écoutent sur 0.0.0.0, qui est IPv4 seulement.
#
# Les sources sont montées dossier par dossier, jamais la racine d'un package : monter
# celle-ci masquerait les `node_modules` installés dans l'image.
name: clemperl_dev

services:
  postgres:
    container_name: clemperl_dev_postgres
    build:
      context: ..
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: clemperl
      POSTGRES_PASSWORD: clemperl
      POSTGRES_DB: clemperl
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clemperl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    container_name: clemperl_dev_redis
    build:
      context: ..
      dockerfile: docker/redis/Dockerfile
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Pièces justificatives des dossiers vendeurs. Il a sa propre base : il y joue ses
  # migrations et y installe ses rôles, ce qui mêlerait ses tables à celles de Prisma
  # s'il partageait la nôtre.
  storage:
    container_name: clemperl_dev_storage
    ports:
      - "5010:5000"
    build:
      context: ..
      dockerfile: docker/storage/Dockerfile
    environment:
      SERVER_PORT: 5000
      SERVER_HOST: 0.0.0.0
      SERVER_REGION: local
      # Sans lui, les objets atterrissent sous un répertoire nommé `undefined`.
      TENANT_ID: clemperl
      AUTH_JWT_SECRET: ${STORAGE_JWT_SECRET}
      AUTH_JWT_ALGORITHM: HS256
      # Les migrations de storage-api référencent le rôle `postgres` en dur, quel que
      # soit `DB_SUPER_USER` : le script d'init de PostgreSQL le crée pour elles.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/storage
      DB_INSTALL_ROLES: "true"
      DB_SUPER_USER: postgres
      STORAGE_BACKEND: file
      STORAGE_FILE_BACKEND_PATH: /var/lib/storage
      # Racine des objets sur le disque malgré son nom : le backend fichier s'en sert
      # aussi comme premier segment de chemin.
      STORAGE_S3_BUCKET: clemperl
      # La même valeur que le domaine applique : un plafond plus bas ici produirait un
      # refus que le message métier n'expliquerait pas.
      UPLOAD_FILE_SIZE_LIMIT: "5242880"
      UPLOAD_FILE_SIZE_LIMIT_STANDARD: "5242880"
      IMAGE_TRANSFORMATION_ENABLED: "false"
    volumes:
      - storage_data:/var/lib/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # `node` plutôt que `curl` ou `wget`, que l'image ne garantit pas.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Crée le bucket au démarrage, pour que `pnpm docker:up` suffise sur une machine
  # neuve. Doit rester idempotent : une création en double répond HTTP 400, le 409
  # n'étant que dans le corps — d'où le test sur `BucketAlreadyExists` et non sur le
  # statut. Et pas de littéral de gabarit dans ce script : Compose interpole `${...}`
  # avant que node ne le voie.
  storage-init:
    container_name: clemperl_dev_storage_init
    build:
      context: ..
      dockerfile: docker/storage/Dockerfile
    environment:
      STORAGE_SERVICE_KEY: ${STORAGE_SERVICE_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - node
      - -e
      - >-
        const cle=process.env.STORAGE_SERVICE_KEY,seau=process.env.STORAGE_BUCKET;fetch('http://storage:5000/bucket',{method:'POST',headers:{Authorization:'Bearer '+cle,'Content-Type':'application/json'},body:JSON.stringify({name:seau,public:false})}).then(function(r){return r.json().then(function(c){return{r:r,c:c};});}).then(function(x){if(x.r.ok||x.c.code==='BucketAlreadyExists'){console.log('bucket '+seau+' pret');return;}console.error(x.c);process.exit(1);}).catch(function(e){console.error(e);process.exit(1);});

  # Déploie les migrations, puis s'arrête. Les quatre applications l'attendent : sur un
  # volume neuf — une machine qui démarre, un runner de CI — la base est vide, et sans
  # cette étape la première inscription échoue sur une table qui n'existe pas. Jouer les
  # migrations à la main marche une fois, sur la machine où on l'a fait.
  #
  # `migrate deploy` et non `migrate dev` : `dev` est interactif et attend une réponse
  # que personne ne donnera ici.
  migrate:
    container_name: clemperl_dev_migrate
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file: ../.env
    volumes:
      - ../packages/db/prisma:/app/packages/db/prisma
    depends_on:
      postgres: { condition: service_healthy }
    command: sh -c "cd packages/db && pnpm exec prisma migrate deploy"
    restart: "no"

  mailpit:
    container_name: clemperl_dev_mailpit
    ports:
      - "8025:8025"
    build:
      context: ..
      dockerfile: docker/mailpit/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  storefront:
    container_name: clemperl_dev_storefront
    ports:
      - "3000:3000"
    build:
      context: ..
      dockerfile: apps/storefront/Dockerfile
      target: dev
    env_file: ../.env
    volumes:
      - ../apps/storefront/src:/app/apps/storefront/src
      - ../packages/core/src:/app/packages/core/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../packages/i18n/src:/app/packages/i18n/src
      - ../packages/i18n/messages:/app/packages/i18n/messages
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  vendor:
    container_name: clemperl_dev_vendor
    ports:
      - "3001:3001"
    build:
      context: ..
      dockerfile: apps/vendor/Dockerfile
      target: dev
    env_file: ../.env
    volumes:
      - ../apps/vendor/src:/app/apps/vendor/src
      - ../packages/core/src:/app/packages/core/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../packages/i18n/messages:/app/packages/i18n/messages
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  admin:
    container_name: clemperl_dev_admin
    ports:
      - "3002:3002"
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      target: dev
    env_file: ../.env
    volumes:
      - ../apps/admin/src:/app/apps/admin/src
      - ../packages/core/src:/app/packages/core/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../packages/i18n/messages:/app/packages/i18n/messages
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  api:
    container_name: clemperl_dev_api
    ports:
      - "3003:3003"
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file: ../.env
    volumes:
      - ../apps/api/src:/app/apps/api/src
      # Les suites E2E de l'API vivent dans `test/`, par convention : seul l'E2E
      # est centralisé, les autres couches sont colocalisées dans `src/`.
      - ../apps/api/test:/app/apps/api/test
      # Les configurations Jest vivent à la racine de l'application, pas dans
      # `src/` : sans ce montage, toute modification exige un rebuild complet.
      - ../apps/api/jest.transform.ts:/app/apps/api/jest.transform.ts
      - ../apps/api/jest.config.ts:/app/apps/api/jest.config.ts
      - ../apps/api/jest.config.integration.ts:/app/apps/api/jest.config.integration.ts
      - ../apps/api/jest.config.contract.ts:/app/apps/api/jest.config.contract.ts
      - ../apps/api/jest.config.e2e.ts:/app/apps/api/jest.config.e2e.ts
      - ../packages/core/src:/app/packages/core/src
      - ../packages/db/src:/app/packages/db/src
      - ../packages/db/prisma:/app/packages/db/prisma
      # Testcontainers démarre de vrais conteneurs : il lui faut le démon Docker.
      # Les conteneurs qu'il crée sont FRÈRES de celui-ci, pas enfants — ils ne sont
      # donc joignables ni par localhost ni par un port publié, mais par leur adresse
      # sur le réseau Docker.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  storage_data:
    name: clemperl_dev_storage_data
  pg_data:
    name: clemperl_dev_pg_data
  redis_data:
    name: clemperl_dev_redis_data
