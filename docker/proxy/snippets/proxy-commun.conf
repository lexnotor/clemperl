# En-têtes communs à tous les hôtes mandatés. Regroupés ici pour qu'un réglage ajouté
# s'applique aux quatre applications, et non à celle qu'on avait sous les yeux.

proxy_http_version 1.1;

# Sans ces deux lignes, aucune connexion WebSocket ne traverse le proxy : le
# rechargement à chaud de Next s'en sert, et Socket.IO s'en servira. nginx ne relaie
# PAS l'upgrade de protocole par défaut, contrairement à d'autres proxys.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Le rechargement à chaud maintient une connexion ouverte en permanence : un délai
# d'attente court la ferait tomber toutes les minutes, avec un rechargement complet
# de la page à chaque fois.
proxy_read_timeout    3600s;
proxy_send_timeout    3600s;
proxy_buffering       off;
