name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ matrix.task }}-${{ github.sha }}
          restore-keys: turbo-${{ matrix.task }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}

      # Vitest ne fails pas on an orphan per-file coverage threshold, unlike Jest.
      # This restores that guard.
      - if: matrix.task == 'test'
        run: pnpm verify:thresholds

  images:
    name: docker (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [storefront, vendor, admin, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # Each app publishes its own port and nothing sits in front of them, so the
      # runner needs no certificate and no host entry.
      - run: cp .env.example .env

      - run: pnpm docker:up

      - name: Wait for services to become healthy
        run: |
          compose="docker compose --env-file .env -f docker/docker-compose.dev.yml"
          for _ in $(seq 1 60); do
            statuses=$($compose ps --format '{{.Health}}')
            if ! echo "$statuses" | grep -qE 'starting|unhealthy'; then
              exit 0
            fi
            sleep 5
          done
          # `logs` without -f: the follow flag would hang the job forever.
          $compose ps
          $compose logs
          exit 1

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - if: always()
        run: docker compose --env-file .env -f docker/docker-compose.dev.yml down -v
